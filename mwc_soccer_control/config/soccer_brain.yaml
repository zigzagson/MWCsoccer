soccer_brain_node:
  ros__parameters:
    # Startup mode: PENALTY_ATTACK or GOALKEEPER.
    # Boot safely in IDLE. Use the remote combinations below to start a mode.
    start_mode: IDLE
    auto_start: true

    # Penalty attack request sent to /soccer/game_mode_cmd.
    # goal_target: left post -1, right post 1, range [-1, 1].
    # Example: 0.3 means right of center.
    goal_target: 0.2
    nav_ball_distance_m: 0.3

    # Remote mode control from rt/lowstate.wireless_remote.
    # Hold each combination for remote_combo_hold_s:
    # L1+R1+A = IDLE
    # L1+R1+X = penalty with the current base parameters
    # L1+R1+Y = goalkeeper_default
    # L1+R1+down = select the next celebration (IDLE only)
    # L1+R1+B = run the selected celebration (IDLE only)
    # L1+R1+left/up/right = penalty_left/center/right
    remote_mode_control_enabled: true
    remote_combo_hold_s: 0.45
    remote_combo_cooldown_s: 1.0

    profiles.penalty_left.goal_target: 0.0
    profiles.penalty_left.nav_ball_distance_m: 0.3
    profiles.penalty_left.align_target_ball_x_m: 0.53
    profiles.penalty_left.align_target_ball_y_m: -0.22
    # Optional per-profile kick model/trajectory. Leave empty to reuse the
    # global kick_model_path / kick_trajectory_path.
    profiles.penalty_left.kick_model_path: "/home/unitree/MWCsoccer/install/mwc_soccer_control/share/mwc_soccer_control/config/StaticShot2_v0_64000.onnx"
    profiles.penalty_left.kick_trajectory_path: "/home/unitree/MWCsoccer/install/mwc_soccer_control/share/mwc_soccer_control/config/StaticShot_2_ext.trajbin"

    profiles.penalty_center.goal_target: 0.0
    profiles.penalty_center.nav_ball_distance_m: 0.4
    profiles.penalty_center.align_target_ball_x_m: 0.7
    profiles.penalty_center.align_target_ball_y_m: -0.22
    profiles.penalty_center.kick_model_path: "/home/unitree/MWCsoccer/install/mwc_soccer_control/share/mwc_soccer_control/config/StaticShot2_v0_64000.onnx"
    profiles.penalty_center.kick_trajectory_path: "/home/unitree/MWCsoccer/install/mwc_soccer_control/share/mwc_soccer_control/config/StaticShot_2_ext.trajbin"

    profiles.penalty_right.goal_target: 0.0
    profiles.penalty_right.nav_ball_distance_m: 0.4
    profiles.penalty_right.align_target_ball_x_m: 0.65
    profiles.penalty_right.align_target_ball_y_m: -0.15
    profiles.penalty_right.kick_model_path: "/home/unitree/MWCsoccer/install/mwc_soccer_control/share/mwc_soccer_control/config/StaticShot2_v0_64000.onnx"
    profiles.penalty_right.kick_trajectory_path: "/home/unitree/MWCsoccer/install/mwc_soccer_control/share/mwc_soccer_control/config/StaticShot2_v0_64000.onnx"

    profiles.goalkeeper_default.lateral_kp: 3.0
    profiles.goalkeeper_default.min_lateral_speed: 0.8
    profiles.goalkeeper_default.lateral_speed: 1.0
    profiles.goalkeeper_default.center_deadband_x: 0.05

    # Unitree SDK2 / G1 loco settings.
    # Set unitree_network_interface when DDS must bind to a specific NIC.
    unitree_network_interface: ""
    velocity_command_topic: /nav/cmd_vel_nav
    align_obstacle_fsm_id: 802
    align_restore_fsm_id: 802
    restore_fsm_after_align: true
    require_unitree_align_mode: true
    align_use_continuous_gait: false

    # State-machine timing.
    control_rate_hz: 20.0
    nav_timeout_s: 45.0
    nav_status_timeout_s: 2.0
    align_timeout_s: 25.0
    perception_timeout_s: 0.6
    post_track_settle_s: 1.0
    ball_perception_wait_timeout_s: 8.0
    kick_on_ball_perception_timeout: true
    pre_kick_pause_s: 0.5

    # ALIGN target and stability gate.
    # ball.x is forward distance in dummy/body frame, ball.y is lateral offset.
    enable_align: true
    align_target_ball_x_m: 0.6
    align_target_ball_y_m: -0.29
    align_x_tolerance_m: 0.15
    align_y_tolerance_m: 0.05
    align_yaw_tolerance_rad: 9.9
    align_required_stable_frames: 2
    kick_on_align_ball_lost_near_feet: true
    align_lost_ball_kick_x_m: 0.45
    align_lost_ball_kick_y_tolerance_m: 0.10
    align_lost_ball_kick_yaw_tolerance_rad: 0.18
    kick_on_align_timeout: true

    # ALIGN correction controller. Each SetVelocity command runs once, then the
    # node waits for the command duration, confirms GetFsmMode=0, waits for the
    # settle period, and then uses a fresh perception sample.
    align_kx: 0.45
    align_ky: 0.55
    align_kw: 0.0
    align_max_vx: 0.50
    align_max_vy: 0.50
    align_max_wz: 0.0
    align_min_speed: 0.21
    # LegController calls Move(vx, vy, vyaw) with continous_move=false by
    # default, so one velocity command remains effective for 1 second.
    align_step_duration_s: 1.00
    align_min_step_period_s: 0.15
    align_require_standing_for_sample: true

    # GOALKEEPER reuses perception.ball as image-centered coordinates:
    # x < 0 left, x > 0 right, y < 0 down, y > 0 up, z = 0.
    # image_has_ball and transform_valid must both be true. Goal fields are
    # ignored because the wide-angle goalkeeper view normally has no goal.
    goalkeeper_min_ball_confidence: 0.30
    goalkeeper_enable_motion: true
    goalkeeper_center_deadband_x: 0.05
    goalkeeper_lateral_kp: 1.3
    goalkeeper_min_lateral_speed: 0.2
    goalkeeper_lateral_speed: 1.00
    # Change to -1.0 if image-right requires negative robot vy on the real G1.
    goalkeeper_lateral_sign: -1.0
    goalkeeper_perception_timeout_s: 1.00

    # Perception validity.
    min_ball_confidence: 0.30
    min_goal_confidence: 0.25

    # Whole-body kick action.
    kick_action_server: /lingshu/action_ctrl
    kick_action_name: PENALTY_KICK
    enable_kick_action: true
    kick_server_timeout_s: 2.0
    kick_result_timeout_s: 8.0

    # Option A: provide the exact JSON consumed by IOROS2REAL/DynamicDanceManager.
    # This takes priority when non-empty.
    kick_action_params_json: ""

    # Option B: leave kick_action_params_json empty and set these paths. The node
    # will build:
    # {"uuid": kick_action_name, "state_name": kick_action_name,
    #  "policy_type": kick_policy_type,
    #  "vendor_name_en": kick_vendor_name_en,
    #  "vendor_name_cn": kick_vendor_name_cn,
    #  "model": kick_model_path,
    #  "trajectory": kick_trajectory_path, "end_behavior": kick_end_behavior,
    #  "quat_comp": kick_quat_comp,
    #  "allowed_from": ["PASSIVE", "LOCO", "FIXEDSTAND"]}
    kick_model_path: "/home/unitree/MWCsoccer/install/mwc_soccer_control/share/mwc_soccer_control/config/StaticShot1_v0_40000.onnx"
    kick_trajectory_path: "/home/unitree/MWCsoccer/install/mwc_soccer_control/share/mwc_soccer_control/config/StaticShot_1_ext.trajbin"
    kick_policy_type: lingshu
    kick_vendor_name_en: lingshu
    kick_vendor_name_cn: 灵枢
    kick_end_behavior: switch_to_loco
    kick_quat_comp: -0.2

    # Whole-body celebration action. Set either the exact JSON or both asset
    # paths before using L1+R1+B.
    celebration_action_server: /lingshu/action_ctrl
    celebration_action_ids:
      [neymar_victory_dance, forward_jump, raised_hand_taunt, stretch_wave]
    celebration_action_names:
      [NEYMAR_VICTORY_DANCE, FORWARD_JUMP, RAISED_HAND_TAUNT, STRETCH_WAVE]
    enable_celebration_action: true
    celebration_server_timeout_s: 2.0
    celebration_result_timeout_s: 15.0
    celebration_action_params_json: ""
    # soccer_brain.launch.py injects all four installed asset paths.
    celebration_model_paths:
      - /home/unitree/MWCsoccer/install/mwc_soccer_control/share/mwc_soccer_control/config/soccer_celebration_actions/neymar_victory_dance/Neymar_40000.onnx
      - /home/unitree/MWCsoccer/install/mwc_soccer_control/share/mwc_soccer_control/config/soccer_celebration_actions/forward_jump/huanhu2_80000.onnx
      - /home/unitree/MWCsoccer/install/mwc_soccer_control/share/mwc_soccer_control/config/soccer_celebration_actions/raised_hand_taunt/huanhu1_50000.onnx
      - /home/unitree/MWCsoccer/install/mwc_soccer_control/share/mwc_soccer_control/config/soccer_celebration_actions/stretch_wave/huanhu3_50000.onnx
    celebration_trajectory_paths:
      - /home/unitree/MWCsoccer/install/mwc_soccer_control/share/mwc_soccer_control/config/soccer_celebration_actions/neymar_victory_dance/Neymar.trajbin
      - /home/unitree/MWCsoccer/install/mwc_soccer_control/share/mwc_soccer_control/config/soccer_celebration_actions/forward_jump/huanhu_002.trajbin
      - /home/unitree/MWCsoccer/install/mwc_soccer_control/share/mwc_soccer_control/config/soccer_celebration_actions/raised_hand_taunt/huanhu_001.trajbin
      - /home/unitree/MWCsoccer/install/mwc_soccer_control/share/mwc_soccer_control/config/soccer_celebration_actions/stretch_wave/huanhu_003.trajbin
    celebration_policy_type: lingshu
    celebration_vendor_name_en: lingshu
    celebration_vendor_name_cn: 灵枢
    celebration_end_behavior: switch_to_loco
    celebration_quat_comp: -0.2
